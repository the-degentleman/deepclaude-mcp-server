# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - defaultProvider
    properties:
      defaultProvider:
        type: string
        enum: [deepseek, openrouter, deepinfra, custom]
        description: Default LLM provider to use
      deepseekApiKey:
        type: string
        description: DeepSeek API key
      openrouterApiKey:
        type: string
        description: OpenRouter API key
      deepinfraApiKey:
        type: string
        description: DeepInfra API key
      customApiConfig:
        type: object
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          parameters:
            type: object
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'uv', args: ['run', 'server.py'], env: { DEEPSEEK_API_KEY: config.deepseekApiKey } })